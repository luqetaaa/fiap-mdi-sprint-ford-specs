spring.application.name=ford-specs-intelligence
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ford_challenge}}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=${PORT:8080}
server.address=0.0.0.0
app.jwt-secret=${JWT_SECRET}
app.seed-catalog=${SEED_DEMO_CATALOG:true}
app.cors-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
